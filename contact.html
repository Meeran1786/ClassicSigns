<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Get a Quote | Classic Signs Hyderabad</title>
  <meta name="description" content="Get a free quote from Classic Signs, Malakpet, Hyderabad. Call, WhatsApp or visit us opposite Akbar Plaza.">
  <meta property="og:title" content="Contact & Get a Quote | Classic Signs Hyderabad">
  <meta property="og:description" content="Get a free quote from Classic Signs, Malakpet, Hyderabad. Call, WhatsApp or visit us opposite Akbar Plaza.">
  <meta property="og:image" content="assets/images/logo-full.jpg">
  <meta name="theme-color" content="#0d1218">
  <link rel="icon" href="assets/images/logo-badge.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Free quote</span>
        <h1>Contact Us</h1>
        <p>Tell us about your sign and we'll get back to you with a design and price.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="panel">
          <h2 style="font-size:1.6rem;margin-bottom:20px">Request a Quote</h2>
          <form id="quote-form">
            <div class="form-row">
              <label>Your name<input name="name" required autocomplete="name"></label>
              <label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
            </div>
            <div class="form-row">
              <label>Product<select name="product" required></select></label>
              <label>Approx. size<input name="size" placeholder="e.g. 6 ft x 2 ft"></label>
            </div>
            <label>Details<textarea name="message" placeholder="Text on the sign, colours, indoor or outdoor, location..."></textarea></label>
            <button class="btn btn-gold" type="submit">Send on WhatsApp</button>
            <p class="form-note">Your enquiry opens in WhatsApp, ready to send. You can attach your logo or photos there.</p>
          </form>
        </div>
        <div>
          <div class="info-item"><div class="icon">&#128205;</div><div><h3>Visit our workshop</h3><p data-site="address"></p></div></div>
          <div class="info-item"><div class="icon">&#128222;</div><div><h3>Call or WhatsApp</h3><div id="phone-list"></div></div></div>
          <div class="info-item"><div class="icon">&#9993;</div><div><h3>Email</h3><div id="email-list"></div></div></div>
          <div class="info-item"><div class="icon">&#128339;</div><div><h3>Working hours</h3><p data-site="hours"></p></div></div>
          <iframe id="map" class="map" title="Classic Signs location on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>

  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
